; Music Assistant タッチリモコン - M5Stack CORE2
[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.4
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
